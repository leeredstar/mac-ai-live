<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小满 · 直播画面</title><link rel="stylesheet" href="/static/stage.css?v=0.3.4"><script defer src="/static/stage.js?v=0.3.4"></script></head>
<body data-action="idle"><div class="scene" id="scene">
<img class="avatar-photo" src="/static/character-xiaoman-v2.png" alt="AI 虚拟主播小满：夜间居家桌边互动场景" fetchpriority="high">
<video id="video-a" class="character-video" muted playsinline preload="auto" aria-hidden="true"></video><video id="video-b" class="character-video" muted playsinline preload="auto" aria-hidden="true"></video>
<div class="stage-brand"><span class="stage-leaf">✳</span><span id="stage-name">小满</span><small id="stage-byline">下班后，陪你坐一会儿。</small></div>
<div class="stage-badges"><span id="live-indicator"><i></i> 本地演示</span><span id="mode-badge">原创写实角色 · 静帧演示</span><span>AI 生成虚拟形象</span></div>
<div class="scene-card" id="scene-card"><span class="scene-card-label" id="scene-card-label">今晚聊什么</span><strong id="scene-card-title">下班后，陪你坐一会儿。</strong><p id="scene-card-description">在工作台发一条弹幕，审核后可播放语音和本地动作素材。</p><div class="scene-card-meta"><span>● 人物静帧</span><span>中文语音 · 本地合成</span></div></div>
<div class="viewer-message" id="viewer-message"><span class="viewer-message-mark">✳</span><span class="viewer-message-body"><small id="viewer-name">直播间</small><strong id="viewer-text">今夜有风，进来坐坐。</strong></span></div>
<div class="stage-message" id="stage-message"></div>
<div class="subtitle" id="subtitle"></div>
<div class="stage-footer"><span>一杯温水，一点闲聊。</span><span id="stage-connection">LOCAL · OFFLINE</span></div>
<button id="enable-audio" class="enable-audio">♫ 启用声音 · 开始观看</button><button id="mute-audio" class="mute-audio hidden" title="静音" aria-label="静音">♫</button>
<audio id="speech" preload="auto"></audio>
</div></body></html>
